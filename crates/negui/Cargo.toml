[package]
name = "negui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "egui front end (eframe): library tree, loupe, controls, histogram, tools, dialogs (L5)"

[features]
default = ["selftest"]
# The `--selftest` harness (`negui::selftest`, `negui::tools::selftest`) and its egui_kittest
# dependency; off for a product build that ships without the test harness.
selftest = ["dep:egui_kittest"]

[lints]
workspace = true

[dependencies]
negkit = { workspace = true }
negsession = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence"] }
craft-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
# Validates a system font before egui sees it (epaint panics on a font it can't parse). Same version
# epaint itself uses, so nothing is built twice.
skrifa = "=0.44.0"
# The headless screenshot harness behind `selftest` (`swiftinvert --selftest out.png [folder]`):
# the whole app rendered offscreen through egui-wgpu — how the shell is verified without a window.
egui_kittest = { workspace = true, features = ["wgpu", "eframe"], optional = true }

# winit refuses to build on Linux without a windowing feature; eframe is reached through
# egui_kittest in `cargo test -p negui`, where the app's own feature set is not unified in.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "persistence", "x11", "wayland"] }

# The native macOS menu bar (pure Rust over AppKit via objc2; MIT OR Apache-2.0 — the crate Tauri
# and LightCraft use). macOS only: Linux/Windows keep the in-window egui menu bar and never build it.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[dev-dependencies]
negraw = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/negcli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"
repository = "https://github.com/python2121/SwiftInvert"

[workspace.dependencies]
# internal
negkit = { path = "crates/negkit" }
negraw = { path = "crates/negraw" }
neggpu = { path = "crates/neggpu" }
negsession = { path = "crates/negsession" }
negui = { path = "crates/negui", default-features = false }

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# imaging / colour
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
tiff = "0.11"
# Pure-Rust ICC v2/v4 colour management (MIT OR Apache-2.0): display + export conversion, profile tagging.
craft-cms = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }
# Pure-Rust RAW decoder (MIT OR Apache-2.0), the default `negraw` backend. Pinned to the revision surveyed 2026-10-15.
lightcraft-raw = { git = "https://github.com/storytold/lightcraft", rev = "0da998f24dfc03069d49867f8877af2bf7c51f94", default-features = false }

# gpu
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
# Shared egui kit from the Craft suite (MIT OR Apache-2.0): icon buttons, tabs, panes, theme helpers.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "d27646a5f7c8b4fc85d9dd3213b8c88b58e0088d" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Parity tests push 1600×1066 images through the CPU chain; keep tests tolerable.
[profile.test]
opt-level = 2
